name: Upstream merge validation

on:
  push:
    branches:
      - analysis/upstream-sync-2026-08-29

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout integration tooling
        uses: actions/checkout@v4
        with:
          path: project

      - name: Reproduce and resolve exact merge
        shell: bash
        run: |
          set -euo pipefail
          OURS=e95df5e09eba365ee3c696ce2d38913f8eb5e0bd
          THEIRS=1a299369ac7025028c3ce1b80cc59f47b7b0691b
          EXPECTED_BASE=b50a007e665ff81845228c7db9d1e32e9c4dc3a2
          git clone --no-tags https://github.com/adunato/Marinara-Engine.git work
          cd work
          git remote add upstream https://github.com/Pasta-Devs/Marinara-Engine.git
          git fetch --no-tags origin main upstream-main
          git fetch --no-tags upstream main
          git config user.name "Upstream Sync Validation"
          git config user.email "upstream-sync-validation@users.noreply.github.com"
          git config merge.conflictStyle zdiff3
          git config rerere.enabled true
          mkdir -p ../analysis/stages/base ../analysis/stages/ours ../analysis/stages/theirs ../analysis/stages/conflicted
          {
            echo "OURS=$OURS"
            echo "THEIRS=$THEIRS"
            echo "ORIGIN_MAIN=$(git rev-parse origin/main)"
            echo "ORIGIN_UPSTREAM_MAIN=$(git rev-parse origin/upstream-main)"
            echo "UPSTREAM_MAIN=$(git rev-parse upstream/main)"
            echo "MERGE_BASE=$(git merge-base "$OURS" "$THEIRS")"
            echo "AHEAD_BEHIND=$(git rev-list --left-right --count "$OURS...$THEIRS")"
          } | tee ../analysis/baseline.txt
          test "$(git merge-base "$OURS" "$THEIRS")" = "$EXPECTED_BASE"
          test "$(git rev-parse upstream/main)" = "$THEIRS"
          test "$(git rev-parse origin/upstream-main)" = "$THEIRS"
          git checkout --detach "$OURS"
          test -z "$(git status --porcelain)"
          set +e
          git merge --no-commit --no-ff "$THEIRS" > ../analysis/merge-output.txt 2>&1
          merge_exit=$?
          set -e
          echo "MERGE_EXIT=$merge_exit" | tee -a ../analysis/baseline.txt
          test "$merge_exit" -eq 1
          git diff --name-only --diff-filter=U > ../analysis/conflicts.txt
          test "$(wc -l < ../analysis/conflicts.txt)" -eq 47
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            for stage in base ours theirs; do
              case "$stage" in
                base) spec=":1:$path" ;;
                ours) spec=":2:$path" ;;
                theirs) spec=":3:$path" ;;
              esac
              out="../analysis/stages/$stage/$path"
              mkdir -p "$(dirname "$out")"
              git show "$spec" > "$out"
            done
            out="../analysis/stages/conflicted/$path"
            mkdir -p "$(dirname "$out")"
            cp "$path" "$out"
          done < ../analysis/conflicts.txt
          cd ..
          python3 project/scripts/upstream-sync/resolve-2026-08-29.py work analysis/stages
          python3 project/scripts/upstream-sync/fix-merged-package-scripts.py work
          cd work
          git add -A
          test -z "$(git ls-files -u)"
          ! grep -RIl --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' --include='*.md' --include='*.yml' --include='*.yaml' '^<<<<<<<\|^>>>>>>>\|^=======$' . --exclude-dir=.git | grep -q .
          git status --short > ../analysis/resolved-status.txt
          git diff --cached --stat > ../analysis/resolved-stat.txt

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install and regenerate lockfile
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          node --version | tee ../analysis/node-version.txt
          pnpm --version | tee ../analysis/pnpm-version.txt
          pnpm install --no-frozen-lockfile
          git add pnpm-lock.yaml
          pnpm install --frozen-lockfile

      - name: Format and sanity check
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write "packages/**/*.{ts,tsx}"
          git add -A
          git diff --cached --check
          node -e 'const p=require("./package.json"); for(const [n,c] of Object.entries(p.scripts)){ for(const m of c.matchAll(/pnpm (regression:[A-Za-z0-9:_-]+)/g)){ if(!p.scripts[m[1]]) throw new Error(`${n} references missing ${m[1]}`) } }'

      - name: Validate CR038 profile segregation
        working-directory: work
        run: pnpm regression:user-profiles

      - name: Validate upstream shared character schedule ownership
        working-directory: work
        run: pnpm build:shared && pnpm --filter @marinara-engine/server exec tsx ../../scripts/regressions/character-schedule-ownership.regression.ts

      - name: Validate CR037 two-pass and summaries
        working-directory: work
        shell: bash
        run: |
          pnpm regression:conversation-two-pass
          pnpm regression:conversation-summary-controls

      - name: Validate CR035 and CR041 emotion behavior
        working-directory: work
        run: pnpm regression:generation-emotion-labels

      - name: Validate Professor Mari CR039 and CR040
        working-directory: work
        shell: bash
        run: |
          pnpm regression:professor-mari-custom-prompt
          pnpm build:shared
          pnpm --filter @marinara-engine/server exec tsx ../../scripts/regressions/character-personality-model.regression.ts
          pnpm --filter @marinara-engine/server exec tsx ../../scripts/regressions/professor-mari-personality-model.regression.ts

      - name: Validate upstream LLM provider stack with Phoenix retained
        working-directory: work
        shell: bash
        run: |
          pnpm regression:providers
          pnpm --filter @marinara-engine/server exec tsx ../../scripts/regressions/rate-limit-aware-provider.regression.ts
          test -f packages/server/src/services/llm/phoenix-tracing-provider.ts
          ! test -f packages/server/src/services/llm/transport-retry-provider.ts
          ! grep -R "withLlmTransportRetries\|transport-retry-provider" packages/server/src --include='*.ts' -n

      - name: Validate other local integration surfaces
        working-directory: work
        shell: bash
        run: |
          pnpm regression:prompt
          pnpm regression:context-sources
          pnpm regression:managed-agents
          pnpm regression:scene-context
          pnpm regression:conversation-custom-tracker
          pnpm regression:character-mind

      - name: Full repository check
        working-directory: work
        run: pnpm check

      - name: Save resolved merge artifact
        if: always()
        shell: bash
        run: |
          set +e
          if [ -d work ]; then
            cd work
            git status --short > ../analysis/final-status.txt
            git diff --cached --stat > ../analysis/final-stat.txt
            git diff --cached --binary > ../analysis/final-merge.patch
            git write-tree > ../analysis/final-tree-sha.txt
          fi

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-merge-validation
          path: analysis/
          if-no-files-found: warn
          retention-days: 7
